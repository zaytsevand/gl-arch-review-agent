# =============================================================================
# ADR Review Agent — Reusable GitLab CI Template
# =============================================================================
#
# Automatically analyzes merge requests for architectural significance and
# maintains an Architecture Decision Log (ADL) and Architecture Decision
# Records (ADRs) in your architecture-decisions repository.
#
# USAGE:
#   Add to your service repo's .gitlab-ci.yml:
#
#     include:
#       - project: 'your-group/adr-review-agent'
#         file: 'ci/adr-agent.gitlab-ci.yml'
#
#   Then set these CI/CD variables in your project or group settings:
#     - ADR_AGENT_GITLAB_TOKEN  (required, masked, protected)
#     - ADR_AGENT_ANTHROPIC_KEY (required, masked, protected)
#     - ADR_AGENT_ARCH_REPO     (required — e.g., 'your-group/architecture-decisions')
#
# See contracts/ci-variables.md for the full variable reference.
# =============================================================================

# ---------------------------------------------------------------------------
# Variables — configure agent behavior via CI/CD settings
# ---------------------------------------------------------------------------
variables:
  # Required (must be set as CI/CD variables — no defaults)
  # ADR_AGENT_GITLAB_TOKEN: ""   # GitLab PAT with api scope
  # ADR_AGENT_ANTHROPIC_KEY: ""  # Anthropic API key
  # ADR_AGENT_ARCH_REPO: ""      # Path to architecture-decisions repo

  # Optional — override in CI/CD settings as needed
  ADR_AGENT_MODEL: "claude-sonnet-4-6"        # LLM model for analysis
  ADR_AGENT_DRY_RUN: "false"                  # "true" = analyze only, no commits/comments
  ADR_AGENT_TARGET_BRANCHES: ""               # Comma-separated (e.g., "main,develop"). Empty = all
  ADR_AGENT_AUTO_BASELINE: "true"             # "true" = auto-generate baseline if missing
  ADR_AGENT_STRICT: "false"                   # "true" = block MR merge on agent failure
  ADR_AGENT_VERBOSE: "false"                  # "true" = print classification reasoning to logs
  ADR_AGENT_TIMEOUT: "600"                    # Stage timeout in seconds (default: 10 minutes)

# ---------------------------------------------------------------------------
# Stage definition — add to the pipeline
# ---------------------------------------------------------------------------
stages:
  - architecture-review

# ---------------------------------------------------------------------------
# Job: adr-review — runs the ADR agent on every merge request
# ---------------------------------------------------------------------------
adr-review:
  stage: architecture-review
  image: ${CI_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/adr-review-agent:latest

  # Only run on merge request pipelines
  rules:
    # Skip if target branch doesn't match filter (when filter is set)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ADR_AGENT_TARGET_BRANCHES != "" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME !~ $ADR_AGENT_TARGET_BRANCHES'
      when: never
    # Run on all merge request events (when no filter or filter matches)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ADR_AGENT_STRICT == "true"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true

  timeout: ${ADR_AGENT_TIMEOUT} seconds

  before_script:
    # Validate required variables
    - |
      MISSING=""
      if [ -z "$ADR_AGENT_GITLAB_TOKEN" ]; then MISSING="$MISSING\n  - ADR_AGENT_GITLAB_TOKEN (GitLab PAT with api scope)"; fi
      if [ -z "$ADR_AGENT_ANTHROPIC_KEY" ]; then MISSING="$MISSING\n  - ADR_AGENT_ANTHROPIC_KEY (Anthropic API key)"; fi
      if [ -z "$ADR_AGENT_ARCH_REPO" ]; then MISSING="$MISSING\n  - ADR_AGENT_ARCH_REPO (path to architecture-decisions repo)"; fi
      if [ -n "$MISSING" ]; then
        echo "ERROR: Missing required CI/CD variables:"
        echo -e "$MISSING"
        echo ""
        echo "Set these in your project or group CI/CD settings:"
        echo "  Settings → CI/CD → Variables"
        echo ""
        echo "See the ADR Review Agent documentation for setup instructions."
        exit 1
      fi

  script:
    - |
      # Build the command
      CMD="adr-agent review-mr '${CI_PROJECT_PATH}!${CI_MERGE_REQUEST_IID}'"
      CMD="$CMD --gitlab-url '$CI_SERVER_URL'"
      CMD="$CMD --gitlab-token '$ADR_AGENT_GITLAB_TOKEN'"
      CMD="$CMD --anthropic-key '$ADR_AGENT_ANTHROPIC_KEY'"
      CMD="$CMD --arch-repo '$ADR_AGENT_ARCH_REPO'"

      # Optional: model selection
      if [ -n "$ADR_AGENT_MODEL" ] && [ "$ADR_AGENT_MODEL" != "claude-sonnet-4-6" ]; then
        CMD="$CMD --model '$ADR_AGENT_MODEL'"
      fi

      # Optional: dry-run mode
      if [ "$ADR_AGENT_DRY_RUN" = "true" ]; then
        CMD="$CMD --dry-run"
        echo "Running in DRY-RUN mode — no commits or comments will be posted."
      fi

      # Optional: verbose mode
      if [ "$ADR_AGENT_VERBOSE" = "true" ]; then
        CMD="$CMD --verbose"
      fi

      echo "Analyzing MR: ${CI_PROJECT_PATH}!${CI_MERGE_REQUEST_IID}"
      echo "Architecture repo: ${ADR_AGENT_ARCH_REPO}"
      echo ""

      # Execute
      eval $CMD
